<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f0e4"><title>活动管理 · 孵化事务所</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./leaderboard.css"><link rel="stylesheet" href="./admin.css"></head><body class="admin-page"><div class="site-shell"><header class="topbar"><a class="brand" href="/"><span class="brand-egg" aria-hidden="true"></span><span><strong>孵化事务所</strong><small>ACTIVITY ADMINISTRATION</small></span></a><nav class="main-nav" aria-label="页面导航"><a class="nav-item nav-link" href="/leaderboard" target="_blank" rel="noopener">公开排行榜 ↗</a><a class="nav-item nav-link" href="/">孵化器</a></nav></header><main><section id="admin-login" class="entry-panel admin-login"><p class="eyebrow">FOR THE EVENT ORGANIZER.</p><h1>活动管理</h1><p class="entry-intro">登录后查看完整姓名和首次成绩，导出活动记录。</p><form id="admin-login-form"><label for="admin-password">管理口令</label><input id="admin-password" type="password" autocomplete="current-password" maxlength="256" required><button class="hatch-button" id="admin-login-button" type="submit">登录管理后台</button></form><p id="admin-login-status" class="entry-status" role="status">正在检查登录状态…</p></section><section id="admin-content" hidden><div class="page-heading"><div><p class="eyebrow">THE FIRST SCORE STAYS.</p><h1>活动成绩管理</h1><p class="intro">完整姓名仅在此显示。每个姓名保留最早一次正式孵化成绩。</p></div><button id="admin-logout" class="back-button" type="button">退出管理</button></div><section class="board-summary" aria-label="活动统计"><div><span>正式完成</span><strong id="admin-completed">—</strong><small id="admin-capacity"></small></div><div><span>已报名</span><strong id="admin-joined">—</strong></div><p id="admin-activity-title"></p></section><p id="admin-error" class="activity-error" role="alert" hidden></p><div class="board-toolbar"><p id="admin-refresh-status" role="status"></p><div><a class="back-button admin-download" href="/api/admin/results.csv" download="孵化首次成绩.csv">导出正式成绩 CSV</a><button class="back-button" id="admin-refresh" type="button">刷新成绩</button></div></div><div class="board-table-wrap"><table class="board-table"><thead><tr><th>排名</th><th>编号</th><th>真实姓名</th><th>首次伙伴</th><th>首次得分</th><th>完成时间</th></tr></thead><tbody id="admin-results"></tbody></table></div><section class="test-entry-panel"><div><h2>专用验收入口</h2><p>生成独立测试会话，不占正式名额，不进入公开排行榜。链接只可兑换一次。</p></div><button class="back-button" id="create-test-entry" type="button">生成测试入口</button><div id="test-entry-result" hidden><label for="test-entry-url">本次测试链接</label><input id="test-entry-url" readonly><div><a id="open-test-entry" class="back-button admin-download" target="_blank" rel="noopener">打开专用测试入口 ↗</a><button id="copy-test-entry" class="back-button" type="button">复制测试链接</button></div></div><p id="test-entry-status" role="status"></p></section></section></main><footer class="footer"><span>妥善保管管理口令和成绩文件。</span><a href="/leaderboard" target="_blank" rel="noopener">公开排行榜 ↗</a></footer></div><script type="module" src="./admin.mjs"></script></body></html>
